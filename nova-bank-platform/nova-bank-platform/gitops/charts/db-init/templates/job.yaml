apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-init-secret
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target: {name: db-init-secret}
  data:
    - {secretKey: PGUSER, remoteRef: {key: {{ .Values.dbSecretKey }}, property: username}}
    - {secretKey: PGPASSWORD, remoteRef: {key: {{ .Values.dbSecretKey }}, property: password}}
    - {secretKey: PGHOST, remoteRef: {key: {{ .Values.dbSecretKey }}, property: host}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: psql
          image: {{ .Values.image }}
          envFrom: [{secretRef: {name: db-init-secret}}]
          env: [{name: PGDATABASE, value: postgres}, {name: PGCONNECT_TIMEOUT, value: "10"}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              {{- range .Values.databases }}
              psql -tc "SELECT 1 FROM pg_database WHERE datname='{{ . }}'" | grep -q 1 || psql -c "CREATE DATABASE {{ . }}"
              {{- end }}
              echo "databases ready"
