apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target: {name: {{ .Values.secretName }}}
  data:
    - secretKey: POSTGRES_USER
      remoteRef: {key: {{ .Values.dbSecretKey }}, property: username}
    - secretKey: POSTGRES_PASSWORD
      remoteRef: {key: {{ .Values.dbSecretKey }}, property: password}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init.sql: |
    CREATE DATABASE accountdb;
    CREATE DATABASE customerdb;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {app: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.image }}
          ports: [{containerPort: 5432}]
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_DB, value: postgres}
          envFrom:
            - secretRef: {name: {{ .Values.secretName }}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U $POSTGRES_USER"]}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, "pg_isready -U $POSTGRES_USER"]}
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - {name: postgres-data, mountPath: /var/lib/postgresql/data}
            - {name: postgres-init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: postgres-init
          configMap: {name: postgres-init}
  volumeClaimTemplates:
    - metadata: {name: postgres-data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests: {storage: {{ .Values.storage }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: account-service}}
        - podSelector: {matchLabels: {app: customer-service}}
      ports: [{port: 5432, protocol: TCP}]
