apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "nova.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {{- include "nova.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nova.labels" . | nindent 8 }}
      annotations:
        {{- if .Values.env }}
        checksum/config: {{ toYaml .Values.env | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "nova.selector" . | nindent 14 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          {{- if or .Values.env .Values.externalSecret.enabled }}
          envFrom:
            {{- if .Values.env }}
            - configMapRef:
                name: {{ .Release.Name }}-config
            {{- end }}
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ .Release.Name }}-secret
            {{- end }}
          {{- end }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- if gt (int .Values.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.preStopSleepSeconds }}"]
          {{- end }}
          {{- $p := .Values.probes }}
          readinessProbe:
            {{- if eq $p.type "http" }}
            httpGet: {path: {{ $p.path }}, port: http}
            {{- else }}
            tcpSocket: {port: http}
            {{- end }}
            initialDelaySeconds: {{ $p.initialDelaySeconds }}
            periodSeconds: {{ $p.periodSeconds }}
            failureThreshold: {{ $p.failureThreshold }}
          livenessProbe:
            {{- if eq $p.type "http" }}
            httpGet: {path: {{ $p.path }}, port: http}
            {{- else }}
            tcpSocket: {port: http}
            {{- end }}
            initialDelaySeconds: {{ add $p.initialDelaySeconds 30 }}
            periodSeconds: {{ $p.periodSeconds }}
            failureThreshold: {{ $p.failureThreshold }}
