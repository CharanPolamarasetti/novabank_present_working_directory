apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-dev
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  project: default
  source:
    repoURL: https://github.com/CharanPolamarasetti/nova_bank_GitOps.git
    targetRevision: master
    path: charts/postgres-dev
    helm: {valueFiles: [../../envs/dev/postgres.yaml]}
  destination: {server: https://kubernetes.default.svc, namespace: novabank-dev}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    retry: {limit: 10, backoff: {duration: 20s, factor: 2, maxDuration: 5m}}
