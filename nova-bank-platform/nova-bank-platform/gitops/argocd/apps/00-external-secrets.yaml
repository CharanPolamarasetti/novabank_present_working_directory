apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: "2.*"          # 2.x line (API external-secrets.io/v1); pin to the exact version after first sync
      helm:
        valueFiles: [$values/platform/external-secrets/values.yaml]
    - repoURL: https://github.com/CharanPolamarasetti/nova_bank_GitOps.git
      targetRevision: master
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: external-secrets}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
