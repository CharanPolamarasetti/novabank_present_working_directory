# EKS Auto Mode custom NodePool: spot-first for cost, on-demand fallback.
# The built-in "system" pool (tainted CriticalAddonsOnly) is enabled in Terraform; app workloads land here.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: apps
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      requirements:
        - {key: karpenter.sh/capacity-type, operator: In, values: ["spot", "on-demand"]}
        - {key: kubernetes.io/arch, operator: In, values: ["amd64"]}
        - {key: eks.amazonaws.com/instance-category, operator: In, values: ["t", "c", "m"]}
        - {key: eks.amazonaws.com/instance-cpu, operator: In, values: ["2", "4"]}
      expireAfter: 336h
  limits:
    cpu: "12"
    memory: 48Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
