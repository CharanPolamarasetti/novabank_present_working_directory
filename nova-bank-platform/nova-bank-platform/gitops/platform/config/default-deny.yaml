# Zero-trust baseline: nothing reaches a pod unless a per-service NetworkPolicy allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: novabank-dev}
spec: {podSelector: {}, policyTypes: [Ingress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: novabank-prod}
spec: {podSelector: {}, policyTypes: [Ingress]}
