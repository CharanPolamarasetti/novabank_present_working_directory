apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: teams-webhook
  namespace: monitoring
  annotations: {argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target: {name: teams-webhook}
  data:
    - secretKey: url
      remoteRef: {key: novabank/prod/teams-webhook}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations: {argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target: {name: grafana-admin}
  data:
    - {secretKey: admin-user, remoteRef: {key: novabank/monitoring/grafana, property: user}}
    - {secretKey: admin-password, remoteRef: {key: novabank/monitoring/grafana, property: password}}
