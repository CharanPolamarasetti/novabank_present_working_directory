environment: prod
image:
  repository: __ECR_REGISTRY__/novabank/customer-service
  tag: "0"
replicaCount: 3
containerPort: 8081
service: {port: 8081}
env:
  DB_PORT: "5432"
  DB_NAME: customerdb
  JWT_EXPIRATION_SECONDS: "3600"
  LOGGING_LEVEL_ROOT: WARN
externalSecret:
  enabled: true
  data:
    - {secretKey: DB_HOST, key: novabank/prod/db, property: host}
    - {secretKey: DB_USERNAME, key: novabank/prod/db, property: username}
    - {secretKey: DB_PASSWORD, key: novabank/prod/db, property: password}
    - {secretKey: JWT_SECRET, key: novabank/prod/jwt, property: secret}
podSecurityContext: {runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 6, cpuUtilization: 70}
networkPolicy:
  allowFromApps: [frontend, account-service]
